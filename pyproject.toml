[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-interaction"
version = "0.1.0"
description = "Camera-based hand gesture mouse control prototype."
requires-python = ">=3.11,<3.13"
dependencies = [
  "opencv-python>=4.9",
  "mediapipe>=0.10",
  "pyautogui>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
new-interaction = "new_interaction.app:main"

